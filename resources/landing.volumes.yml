resources:
  schemas:
    landing_schema:
      catalog_name: ${var.catalog}
      name: ${var.base_schema}
      comment: Raw file landing area for the Payments Lakehouse project.
  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing_schema.name}
      name: raw_data
      volume_type: MANAGED
      comment: Synthetic source files for incremental ingestion; no raw source tables.

